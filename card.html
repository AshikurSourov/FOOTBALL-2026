<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official Player Card</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@500;700;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071b18;color:#eff7e9;font-family:'DM Sans','Noto Sans Bengali',sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,480px);text-align:center}.actions{display:flex;justify-content:center;gap:10px;margin:20px 0}.actions button,.actions a{border:1px solid #ffffff25;background:#c7f36b;color:#10251b;padding:12px 16px;border-radius:11px;font-weight:800;text-decoration:none;cursor:pointer}.actions a{background:#ffffff10;color:white}.card{position:relative;overflow:hidden;min-height:590px;padding:27px;border-radius:28px;text-align:left;background:linear-gradient(150deg,#183e32,#0c211c 68%);border:1px solid #c7f36b57;box-shadow:0 30px 90px #0008}.card:before{content:'';position:absolute;width:380px;height:380px;border:1px solid #c7f36b25;border-radius:50%;right:-180px;top:30px;box-shadow:0 0 0 30px #c7f36b08,0 0 0 70px #c7f36b06}.brand{font-size:12px;letter-spacing:2px;color:#c7f36b;font-weight:800;position:relative}.title{font-size:26px;font-weight:800;margin-top:4px;position:relative}.photo{width:160px;height:185px;object-fit:cover;object-position:center;border-radius:20px;border:3px solid #c7f36b;margin:27px 0 18px;position:relative;background:#18382f}.name{font-size:29px;font-weight:800;line-height:1.2;position:relative}.team{color:#c7f36b;font-weight:700;margin-top:7px;position:relative}.number{position:absolute;right:27px;top:180px;font-size:72px;font-weight:800;color:#ffffff13}.info{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px;position:relative}.cell{padding:12px;background:#ffffff0c;border:1px solid #ffffff16;border-radius:12px}.cell span{font-size:10px;color:#a9beb1;display:block;letter-spacing:1px}.cell b{font-size:14px;display:block;margin-top:5px}.id{font-size:10px;color:#9bb1a4;margin-top:22px;overflow-wrap:anywhere;position:relative}.approved{position:absolute;right:26px;bottom:24px;color:#c7f36b;font-size:10px;letter-spacing:1.5px;font-weight:800}.status{color:#c7f36b;font-size:15px}.back{color:#c7f36b;text-decoration:none;font-size:13px}
body{background:radial-gradient(ellipse at 50% 0%,#1676a744 0,transparent 42%),#061827}.card{background:linear-gradient(150deg,#174661dd,#071d2bee);border-color:#75ddff77;box-shadow:0 30px 90px #0008;backdrop-filter:blur(16px)}.card:before{border-color:#75ddff35;box-shadow:0 0 0 30px #75ddff0b,0 0 0 70px #75ddff08}.brand,.team,.approved,.status{color:#75ddff}.photo{border-color:#75ddff}.actions button,.actions a{border-color:#a9eaff44;background:linear-gradient(110deg,#a3efff,#55c9f5);color:#062339}.actions a{background:#a7eaff12;color:#effaff}
</style></head><body><div class="wrap"><div id="status" class="status">কার্ড লোড হচ্ছে…</div><div id="card" class="card" style="display:none"><div class="brand">⚽ SWAPNO SARATHI JUBO SANGHA · OFFICIAL</div><div class="title">PLAYER CARD</div><div class="number" id="bigNumber"></div><img class="photo" id="photo" alt="Player"><div class="name" id="name"></div><div class="team" id="village"></div><div class="info"><div class="cell"><span>PLAYING POSITION</span><b id="role"></b></div><div class="cell"><span>JERSEY SIZE / NO.</span><b><i id="size"></i> · #<i id="jerseyNo"></i></b></div><div class="cell"><span>AGE · BLOOD GROUP</span><b><i id="age"></i> · <i id="blood"></i></b></div><div class="cell"><span>PLAYER CATEGORY</span><b id="category"></b></div></div><div class="id" id="regid"></div><div class="approved">VERIFIED PLAYER ✓</div></div><div class="actions" id="actions" style="display:none"><button id="download">⬇ Download card</button><a href="index.html">← Home</a></div></div><script type="module" src="./card.js"></script></body></html>
